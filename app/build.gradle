plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.stickermatch'
    compileSdk 36

    defaultConfig {
        applicationId "ru.stickermatch"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // подписываем отладочным ключом, чтобы APK можно было просто установить
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
